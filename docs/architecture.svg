<polyline points="105,240 105,320 215,320" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="150" y="313" font-size="12" text-anchor="middle" fill="#343a40">asks</text>
<polyline points="440,195 475,195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="440,320 475,320" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="600,240 600,280" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<polyline points="725,195 760,195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="180,485 215,485" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="440,485 475,485" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="600,530 600,570" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<polyline points="725,485 760,485" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="105,530 105,670 875,670 875,640" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<text x="480" y="663" font-size="12" text-anchor="middle" fill="#343a40">approves / rejects, answers questions</text>
<polyline points="990,395 1025,395" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="1255,395 1290,395" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="30" y="700" width="1540" height="34" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="800.0" y="721.55" font-size="13" text-anchor="middle" font-weight="bold">Safety guardrails (always on)</text>
<rect x="30.0" y="750" width="370.0" height="100" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="215.0" y="780.17" font-size="13" text-anchor="middle" font-weight="bold">Audit log, append-only</text>
<text x="215.0" y="796.42" font-size="13" text-anchor="middle">Postgres (Neon) in prod, unique</text>
<text x="215.0" y="812.67" font-size="13" text-anchor="middle">event_key; app role may only</text>
<text x="215.0" y="828.92" font-size="13" text-anchor="middle">INSERT and SELECT</text>
<rect x="420.0" y="750" width="370.0" height="100" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="605.0" y="780.17" font-size="13" text-anchor="middle" font-weight="bold">Prompt-injection detector</text>
<text x="605.0" y="796.42" font-size="13" text-anchor="middle">HIGH/LOW rules, withheld spans,</text>
<text x="605.0" y="812.67" font-size="13" text-anchor="middle">echo check, argument-source</text>
<text x="605.0" y="828.92" font-size="13" text-anchor="middle">allowlist, needs_review flag</text>
<rect x="810.0" y="750" width="370.0" height="100" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="995.0" y="788.30" font-size="13" text-anchor="middle" font-weight="bold">The rule engine decides money</text>
<text x="995.0" y="804.55" font-size="13" text-anchor="middle">not the LLM; documents are data,</text>
<text x="995.0" y="820.80" font-size="13" text-anchor="middle">never instructions; no mass send</text>
<rect x="1200.0" y="750" width="370.0" height="100" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="1385.0" y="780.17" font-size="13" text-anchor="middle" font-weight="bold">Caps per claim run</text>
<text x="1385.0" y="796.42" font-size="13" text-anchor="middle">250k tokens, 600 s, 10 gated calls,</text>
<text x="1385.0" y="812.67" font-size="13" text-anchor="middle">3 searches per gap; 3 runs/min,</text>
<text x="1385.0" y="828.92" font-size="13" text-anchor="middle">1 live run at a time</text>
</svg>
