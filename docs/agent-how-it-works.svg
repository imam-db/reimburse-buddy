<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" font-family="Helvetica,Arial,sans-serif"><rect width="100%" height="100%" fill="white"/><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#1e1e1e"/></marker></defs>
<line x1="230" y1="160.0" x2="280" y2="160.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="490" y1="160.0" x2="540" y2="160.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="750" y1="160.0" x2="800" y2="160.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="1010" y1="160.0" x2="1060" y2="160.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="1165.0" y1="210" x2="1165.0" y2="280" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<text x="1171.0" y="241.0" font-size="13">yes</text>
<line x1="1060" y1="330.0" x2="1010" y2="330.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="800" y1="330.0" x2="750" y2="330.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="1165.0" y1="210" x2="645.0" y2="280" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ah)"/>
<text x="911.0" y="241.0" font-size="13">no</text>
<line x1="540" y1="330.0" x2="490" y2="330.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="280" y1="330.0" x2="230" y2="330.0" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<line x1="125.0" y1="380" x2="125.0" y2="450" stroke="#1e1e1e" stroke-width="2"  marker-end="url(#ah)"/>
<rect x="20" y="10" width="1560" height="50" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="800.0" y="42.0" font-size="20" text-anchor="middle" font-weight="bold">How the Reimburse Buddy agent works</text>
<rect x="20" y="110" width="210" height="100" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="125.0" y="156.425" font-size="13" text-anchor="middle">1. Employee</text>
<text x="125.0" y="172.675" font-size="13" text-anchor="middle">submits a claim</text>
<rect x="280" y="110" width="210" height="100" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="385.0" y="156.425" font-size="13" text-anchor="middle">2. Agent reads</text>
<text x="385.0" y="172.675" font-size="13" text-anchor="middle">the claim &amp; policy</text>
<rect x="540" y="110" width="210" height="100" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="645.0" y="148.3" font-size="13" text-anchor="middle">3. Rule engine</text>
<text x="645.0" y="164.55" font-size="13" text-anchor="middle">(check_claim)</text>
<text x="645.0" y="180.8" font-size="13" text-anchor="middle">finds gaps</text>
<rect x="800" y="110" width="210" height="100" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="905.0" y="148.3" font-size="13" text-anchor="middle">4. Agent searches the</text>
<text x="905.0" y="164.55" font-size="13" text-anchor="middle">reimburse mailbox</text>
<text x="905.0" y="180.8" font-size="13" text-anchor="middle">(receipts, boarding pass)</text>
<polygon points="1165.0,110 1270,160.0 1165.0,210 1060,160.0" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1165.0" y="164.55" font-size="13" text-anchor="middle">Still missing?</text>
<rect x="1060" y="280" width="210" height="100" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1165.0" y="318.3" font-size="13" text-anchor="middle">5. Agent asks the employee</text>
<text x="1165.0" y="334.55" font-size="13" text-anchor="middle">(request_missing_evidence,</text>
<text x="1165.0" y="350.8" font-size="13" text-anchor="middle">fixed template)</text>
<rect x="800" y="280" width="210" height="100" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="905.0" y="326.425" font-size="13" text-anchor="middle">6. Employee replies</text>
<text x="905.0" y="342.675" font-size="13" text-anchor="middle">with evidence</text>
<rect x="540" y="280" width="210" height="100" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="645.0" y="326.425" font-size="13" text-anchor="middle">7. Re-check</text>
<text x="645.0" y="342.675" font-size="13" text-anchor="middle">(check_claim)</text>
<rect x="280" y="280" width="210" height="100" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="385.0" y="318.3" font-size="13" text-anchor="middle">8. Needs judgment?</text>
<text x="385.0" y="334.55" font-size="13" text-anchor="middle">Finance reviewer decides</text>
<text x="385.0" y="350.8" font-size="13" text-anchor="middle">(agent can't decide for them)</text>
<rect x="20" y="280" width="210" height="100" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="125.0" y="326.425" font-size="13" text-anchor="middle">9. Draft decision</text>
<text x="125.0" y="342.675" font-size="13" text-anchor="middle">approve / cap / review</text>
<rect x="20" y="450" width="210" height="100" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="125.0" y="496.425" font-size="13" text-anchor="middle">10. Finance takes</text>
<text x="125.0" y="512.675" font-size="13" text-anchor="middle">the final action</text>
<rect x="280" y="450" width="1300" height="40" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="930.0" y="474.55" font-size="13" text-anchor="middle">Safety guardrails (always on)</text>
<rect x="280" y="500" width="310" height="90" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="435.0" y="541.425" font-size="13" text-anchor="middle">Read-only tools run freely</text>
<text x="435.0" y="557.675" font-size="13" text-anchor="middle">(list, get, search, check, draft)</text>
<rect x="610" y="500" width="310" height="90" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="765.0" y="533.3" font-size="13" text-anchor="middle">Every write or message</text>
<text x="765.0" y="549.55" font-size="13" text-anchor="middle">needs human approval</text>
<text x="765.0" y="565.8" font-size="13" text-anchor="middle">(except capped evidence requests)</text>
<rect x="940" y="500" width="310" height="90" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="1095.0" y="541.425" font-size="13" text-anchor="middle">The rule engine decides money,</text>
<text x="1095.0" y="557.675" font-size="13" text-anchor="middle">not the LLM</text>
<rect x="1270" y="500" width="310" height="90" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="1425.0" y="533.3" font-size="13" text-anchor="middle">Budgets &amp; caps: 10 approvals,</text>
<text x="1425.0" y="549.55" font-size="13" text-anchor="middle">3 evidence requests, search limits,</text>
<text x="1425.0" y="565.8" font-size="13" text-anchor="middle">600 s run deadline</text>
<rect x="1340" y="110" width="240" height="36" rx="8" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
<text x="1460.0" y="132.55" font-size="13" text-anchor="middle">Legend</text>
<rect x="1340" y="150" width="240" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
<text x="1460.0" y="170.55" font-size="13" text-anchor="middle">Employee</text>
<rect x="1340" y="186" width="240" height="32" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
<text x="1460.0" y="206.55" font-size="13" text-anchor="middle">AI agent</text>
<rect x="1340" y="222" width="240" height="32" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
<text x="1460.0" y="242.55" font-size="13" text-anchor="middle">Rule engine (deterministic)</text>
<rect x="1340" y="258" width="240" height="32" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
<text x="1460.0" y="278.55" font-size="13" text-anchor="middle">Finance (human)</text>
<rect x="1340" y="294" width="240" height="32" rx="8" fill="#fff5f5" stroke="#c92a2a" stroke-width="2"/>
<text x="1460.0" y="314.55" font-size="13" text-anchor="middle">Guardrail</text>
</svg>