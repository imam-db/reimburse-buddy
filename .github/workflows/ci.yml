name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Root and web tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract, Indonesian language data, and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind poppler-utils

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --group dev --group rapidocr

      - name: Show OCR engine version
        run: tesseract --version | head -n 1

      - name: Run root test suite
        run: uv run pytest -q tests -ra

  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install agent dependencies
        working-directory: agent
        run: uv sync

      - name: Run agent test suite
        working-directory: agent
        run: uv run pytest -q -ra
