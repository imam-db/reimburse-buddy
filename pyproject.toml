[project]
name = "reimburse-buddy"
version = "0.1.0"
description = "Business-travel expense-claim auditing agent for Tencent WorkBuddy: a local MCP server with mock office tools and a deterministic rule engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
# The web process opens PostgresAuditLog when REIMBURSE_AUDIT_DATABASE_URL is set.
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
reimburse-buddy-mcp = "reimburse_buddy.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", {include-group = "web"}, {include-group = "ocr"}, "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "langgraph>=0.6"]
ocr = ["pillow>=10", "pytesseract>=0.3.10", "pdf2image>=1.17"]
rapidocr = ["rapidocr>=3.4", "onnxruntime>=1.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reimburse_buddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["web"]
asyncio_mode = "auto"
